# Example only: copy to local/inventory.ini and configure a disposable target.
# 192.0.2.10 is a documentation address, not a reachable lab target.
[windows]
lab ansible_host=192.0.2.10

[windows:vars]
ansible_user=LAB_USER
ansible_connection=winrm
ansible_winrm_scheme=https
ansible_port=5986
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=validate
# Supply the password with --ask-pass or an external Ansible Vault inventory.
# Configure a trusted server certificate; do not disable certificate validation.
